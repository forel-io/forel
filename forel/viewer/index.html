<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layers, darkest to lightest (light theme): chrome (toolbars, tab strip) → panel (timeline, sidebar) → bg (the event list).
   Blue (--accent) marks controls; yellow-orange (--focus) marks where you are: the open event, the active tab. */
:root {
  --chrome: #e3e5e9; --panel: #f1f2f4; --bg: #fbfbfc; --field: #ffffff; --ink: #1d2127; --muted: #69707b;
  --line: #d2d5db; --line2: #c2c6cd; --accent: #2563d9; --focus: #f0a000; --mark: #ffe25a; --mark-current: #ff9d2e;
  --lane: rgba(20,30,50,.035); --hover: rgba(20,30,50,.06); --blk: 52%; --note: #fff6d6; --note-line: #e2c560;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  font-family: var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --chrome: #17191c; --panel: #1f2125; --bg: #1a1c1f; --field: #131417; --ink: #d9dce1; --muted: #888e98;
    --line: #2f3238; --line2: #3d4148; --accent: #5c9af7; --focus: #ffc23d; --lane: rgba(255,255,255,.03); --hover: rgba(255,255,255,.06); --blk: 20%; --note: #3a3220; --note-line: #7a6326; }
}
:root[data-theme="dark"] { --chrome: #17191c; --panel: #1f2125; --bg: #1a1c1f; --field: #131417; --ink: #d9dce1; --muted: #888e98;
  --line: #2f3238; --line2: #3d4148; --accent: #5c9af7; --focus: #ffc23d; --lane: rgba(255,255,255,.03); --hover: rgba(255,255,255,.06); --blk: 20%; --note: #3a3220; --note-line: #7a6326; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums;
  display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

/* ---------- controls: 24px tall, square-ish ---------- */
header { background: var(--chrome); border-bottom: 1px solid var(--line); padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 5px 14px; align-items: center; }
.ctl { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.ctl input[type=search], .ctl select, .btn { height: 24px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); }
.ctl input[type=search] { width: 200px; max-width: 42vw; padding: 0 7px; }
.ctl select { max-width: 22vw; padding: 0 4px; cursor: pointer; }
.btn { display: inline-flex; align-items: center; padding: 0 8px; cursor: pointer; white-space: nowrap; }
.btn:hover, .ctl select:hover { border-color: var(--muted); }
.btn.on { background: color-mix(in srgb, var(--accent) 16%, var(--field)); border-color: color-mix(in srgb, var(--accent) 60%, var(--line2)); font-weight: 600; position: relative; z-index: 1; }
.ctl label { display: flex; gap: 4px; align-items: center; color: var(--muted); white-space: nowrap; cursor: pointer; }
.ctl label.btn { color: var(--ink); }
input[type=checkbox] { accent-color: var(--accent); margin: 0; }
.count { color: var(--muted); }
.small { font-size: 11.5px; color: var(--muted); }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-left: -1px; }
.seg .btn:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.seg .btn:last-child { border-radius: 0 3px 3px 0; }
.seg .btn:hover { position: relative; z-index: 2; }
#theme { width: 26px; justify-content: center; padding: 0; }

/* ---------- timeline (zoomed out) ---------- */
#tl { background: var(--panel); border-bottom: 1px solid var(--line); }
#tlbar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
#tlRow { display: flex; position: relative; }
#tlWrap { position: relative; flex: 1; min-width: 0; max-height: 40vh; overflow-y: auto; overflow-x: hidden; padding: 2px 10px 4px; }
#tagGrip { position: absolute; top: 0; bottom: 0; right: calc(var(--tag-w, 250px) - 4px); width: 7px; z-index: 4; cursor: col-resize; touch-action: none; }
#tagGrip:hover, #tagGrip.drag { background: linear-gradient(90deg, transparent 2px, var(--focus) 2px, var(--focus) 5px, transparent 5px); }
#tagPanel.hidden + #tagGrip { display: none; }
#tagPanel { flex: none; width: var(--tag-w, 250px); max-height: 40vh; overflow-y: auto; border-left: 1px solid var(--line); padding: 6px 6px 6px 8px; font-size: 12px; }
#split { height: 7px; margin: -4px 0 -3px; position: relative; z-index: 5; cursor: row-resize; touch-action: none; }
#split::after { content: ''; position: absolute; left: 0; right: 0; top: 3px; height: 1px; }
#split:hover::after, #split.drag::after { top: 2px; height: 3px; background: var(--focus); }
#tagPanel h3 { margin: 0 0 4px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
#tagPanel h3:hover { color: var(--ink); }
#tagPanel h3 .fold { display: inline-block; width: 1em; }
/* Collapsed: a thin strip with the title running down it; click it to open the panel again. */
#tagPanel.shut { width: 24px; padding: 6px 0; overflow: hidden; cursor: pointer; }
#tagPanel.shut:hover { background: var(--hover); }
#tagPanel.shut + #tagGrip, #tagPanel.shut > :not(h3) { display: none; }
#tagPanel.shut h3 { writing-mode: vertical-rl; margin: 0 auto; }
.trow { display: flex; align-items: center; gap: 7px; padding: 2px 5px; border-radius: 3px; cursor: default; border: 1px solid transparent; }
.trow[data-k], .trow .x { cursor: pointer; }
.trow:hover { background: var(--hover); }
.trow.on { border-color: var(--focus); background: color-mix(in srgb, var(--focus) 12%, transparent); font-weight: 600; }
.trow .sw { width: 11px; height: 11px; border-radius: 50%; cursor: pointer; border: 0; }
.trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .n, .trow kbd { color: var(--muted); font-size: 11px; }
.trow .x { visibility: hidden; color: var(--muted); padding: 0 3px; border-radius: 3px; }
.trow:hover .x { visibility: visible; } .trow .x:hover { background: var(--line); color: var(--ink); }
.trow.none { cursor: default; color: var(--muted); }
#tagAdd { margin: 4px 0 0 1px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 5px; font: inherit; font-size: 12px; }
.tagpill { padding: 0 6px; border-radius: 2px; background: var(--tc); color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; line-height: 17px; }
@media (max-width: 860px) { #tlRow { flex-direction: column; } #tagPanel { width: auto; border-left: 0; border-top: 1px solid var(--line); } #tagPanel.shut { width: auto; padding: 4px 8px; } #tagPanel.shut h3 { writing-mode: horizontal-tb; margin: 0; } #tagGrip { display: none; } }
#tlCanvas { display: block; width: 100%; cursor: crosshair; }
#laneAdd { position: fixed; z-index: 30; width: 300px; max-height: 340px; display: flex; flex-direction: column; background: var(--panel);
  border: 1px solid var(--line2); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 5px; font-size: 12px; }
#laneAdd input { height: 24px; padding: 0 7px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); margin-bottom: 4px; }
#laneAdd .list { overflow-y: auto; }
#laneAdd .it { display: flex; gap: 6px; padding: 2px 6px; border-radius: 3px; cursor: pointer; }
#laneAdd .it:hover, #laneAdd .it.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
#laneAdd .it .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#laneAdd .it .n { color: var(--muted); }
#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 380px; padding: 5px 8px; border-radius: 3px; border: 1px solid var(--line2);
  background: var(--panel); color: var(--ink); font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
#tip b { font-weight: 600; }

/* ---------- main: sidebar + event list (zoomed in) ---------- */
/* The sidebar (#side: incidents, search results, channels, agents, keys) is hidden: the event list takes the whole width.
   Its code still renders into it, so it can come back by removing the display: none below. */
main { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
#side { display: none !important; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); overflow: auto; } aside, #detail { overflow: visible !important; } }
aside { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 0 0 12px; }
aside h2 { position: sticky; top: 0; z-index: 1; font-size: 11.5px; font-weight: 600; color: var(--ink); margin: 0; padding: 5px 10px; background: var(--chrome);
  border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: baseline; }
aside h2:first-child { border-top: 0; }
aside h2 .small { font-weight: 400; }
aside h2 a { margin-left: auto; font-weight: 400; cursor: pointer; }
aside > :not(h2) { margin-left: 8px; margin-right: 8px; }
aside > div.small, #hitBox > .small { padding: 6px 2px; }
aside h2 + * { margin-top: 6px; }
aside > :not(h2) + h2 { margin-top: 10px; }
.inc-card { display: block; width: calc(100% - 16px); text-align: left; margin: 4px 8px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); cursor: pointer; }
.inc-card:hover { border-color: var(--accent); }
.inc-card b { display: block; font-weight: 600; }

.legend { display: flex; flex-direction: column; gap: 0; }
.chip { display: flex; align-items: center; gap: 7px; padding: 2px 5px; border-radius: 3px; cursor: pointer; border: 1px solid transparent; user-select: none; }
.chip:hover { background: var(--hover); }
.chip.off { opacity: .35; }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw { width: 11px; height: 11px; border-radius: 2px; flex: none; border: 1px solid rgba(0,0,0,.18); }
.chip .n { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
.chip.cur { border-color: var(--focus); background: color-mix(in srgb, var(--focus) 12%, transparent); }
#chFilter { width: calc(100% - 16px); height: 24px; padding: 0 7px; margin-bottom: 4px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); }

.pb { display: inline-block; min-width: 22px; text-align: center; padding: 0 4px; border-radius: 2px; background: var(--ink); color: var(--bg); font-size: 10.5px; font-weight: 600; line-height: 17px; }
.pb.p2 { opacity: .78; } .pb.p3 { opacity: .58; } .pb.p4 { opacity: .42; }

#detail { overflow: auto; min-width: 0; overflow-anchor: none; background: var(--bg); }
.row:first-child > .gap { display: none; }
#dbar { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 0 14px; align-items: center; }
#dbar > .ctl { padding: 4px 0 4px 10px; }
#blocks { padding: 8px 14px 40vh; max-width: 980px; }
.empty { color: var(--muted); padding: 40px 10px; text-align: center; }
.drop { border: 1px dashed var(--line2); border-radius: 4px; padding: 36px 16px; margin: 16px; }
.gap { text-align: center; color: var(--muted); font-size: 11px; margin: 1px 0; }

/* Tabs: flush rectangles in a strip; the active one takes the list's background and a --focus bar on top. */
#tabs { flex: 1 0 100%; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; background: var(--chrome); border-bottom: 1px solid var(--line); }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 34ch; height: 30px; padding: 0 8px 0 12px; border: 0; border-right: 1px solid var(--line);
  border-radius: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: 12.5px; position: relative; margin-bottom: -1px; }
.tab:hover { color: var(--ink); background: var(--hover); }
.tab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .k { font-size: 11px; color: var(--muted); }
.tab.on { color: var(--ink); background: var(--panel); box-shadow: inset 0 2px 0 var(--focus); border-bottom: 1px solid var(--panel); }
.tab .x { width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 3px; color: var(--muted); visibility: hidden; }
.tab.on .x, .tab:hover .x { visibility: visible; }
.tab .x:hover { background: var(--line); color: var(--ink); }
.tab.add { color: var(--muted); padding: 0 12px; font-size: 15px; }
/* A search tab's parameters, above its results; the header collapses them to one line. */
#sp { flex: 1 0 100%; border-bottom: 1px solid var(--line); padding: 3px 10px 6px; }
.sph { display: flex; align-items: baseline; gap: 10px; width: 100%; border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left; }
.sph b { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sph .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#sp.shut { padding-bottom: 3px; }
#sp.shut #spBody { display: none; }
#spBody { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; margin-top: 3px; }
#spBody > label { font-size: 12px; color: var(--muted); }
#spQ, .cin { width: 100%; padding: 1px 6px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); min-height: 26px; }
.cin { position: relative; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; cursor: text; }
.cin:focus-within, #spQ:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.cin input { flex: 1; min-width: 12ch; border: 0; outline: 0; background: none; padding: 1px 2px; }
.cin .chips { display: contents; }
.sfc { display: inline-flex; gap: 3px; align-items: center; padding: 0 2px 0 6px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 14%, var(--field)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); font-size: 12px; max-width: 30ch; line-height: 18px; }
.sfc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sfc .x { cursor: pointer; padding: 0 4px; border-radius: 2px; color: var(--muted); } .sfc .x:hover { background: var(--line); color: var(--ink); }
.sug { position: absolute; z-index: 10; top: calc(100% + 2px); left: -1px; right: -1px; max-height: 40vh; overflow-y: auto; padding: 3px; border: 1px solid var(--line2); border-radius: 3px; background: var(--panel); box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.nti { display: flex; align-items: center; gap: 8px; padding: 2px 6px; border-radius: 2px; cursor: pointer; font-size: 12px; }
.nti.sel, .nti:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.nti .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nti .n { color: var(--muted); font-size: 11px; white-space: nowrap; }

/* Tag menu (the tag button on an event) */
#tagMenu { position: fixed; z-index: 15; min-width: 170px; max-height: 50vh; overflow-y: auto; padding: 3px; border: 1px solid var(--line2); border-radius: 4px; background: var(--panel); box-shadow: 0 8px 24px rgba(0,0,0,.22); font-size: 12px; }
#tagMenu .tm { display: flex; align-items: center; gap: 7px; width: 100%; padding: 3px 6px; border: 0; border-radius: 3px; background: none; color: var(--ink); cursor: pointer; font: inherit; text-align: left; }
#tagMenu .tm:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
#tagMenu .tm.on { font-weight: 600; }
#tagMenu .tm .sw { width: 10px; height: 10px; border-radius: 50%; border: 0; }
#tagMenu .tm .ck { margin-left: auto; color: var(--muted); }
#tagMenu .tm.add { color: var(--accent); }
/* Pop-ups: the custom view builder and the context box */
.modalBack { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.35); }
.modalBack.hidden { display: none; }
.modal { display: flex; flex-direction: column; width: min(640px, 100%); max-height: min(85vh, 760px); border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.3); font-size: 12.5px; }
.modal.cxm { width: min(520px, 100%); }
.vbhead { display: flex; align-items: center; padding: 8px 10px 7px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.vbhead b { font-weight: 600; }
.vbx { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 19px; line-height: 1; padding: 0 6px; border-radius: 3px; cursor: pointer; }
.vbx:hover { background: var(--line); color: var(--ink); }
.vbbody { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 12px; }
.vbtop { display: flex; gap: 8px; align-items: center; }
.vbtop #vbName { flex: 1; min-width: 0; }
.vbsec { margin-top: 10px; }
.vbsec:empty { display: none; }
.vbh { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.vbh b { font-weight: 600; font-size: 12px; }
.modal input[type=text], .modal input[type=search], .modal input[type=number] { height: 24px; padding: 0 7px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); color: var(--ink); }
.vbh input[type=search] { width: 140px; } #vbText { width: 100%; }
.lnk { border: 0; background: none; padding: 0 2px; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; }
.vbl { display: flex; flex-wrap: wrap; gap: 4px; max-height: 128px; overflow-y: auto; }
.vbc { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 5px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); cursor: pointer; white-space: nowrap; line-height: 20px; }
.vbc:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 60%, var(--line2)); background: color-mix(in srgb, var(--accent) 14%, var(--field)); font-weight: 600; }
.vbc .n { color: var(--muted); font-size: 11px; font-weight: 400; }
.vbc .sw { width: 10px; height: 10px; border-radius: 50%; border: 0; }
.vbfoot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 14px; border-top: 1px solid var(--line); }
.vbfoot .count { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#vbOpen:disabled { opacity: .45; cursor: default; }
#cxBefore, #cxAfter { width: 64px; margin-left: 4px; }
.cxm .vbh label { display: inline-flex; align-items: center; }
.tab .ed { width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 3px; color: var(--muted); visibility: hidden; }
.tab.on .ed, .tab:hover .ed { visibility: visible; }
.tab .ed:hover { background: var(--line); color: var(--ink); }
#ctxBtn { max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk.ctxev { opacity: .5; }
.blk.ctxev:hover, .blk.ctxev.focus { opacity: 1; }

/* Event blocks: the agent's color, mixed into the background (strongly in light, softly in dark). */
.blk { position: relative; margin: 4px 0; border-radius: 4px; padding: 6px 11px 8px; color: var(--ink);
  background: color-mix(in srgb, var(--c) var(--blk), var(--bg)); border: 1px solid color-mix(in srgb, var(--c) calc(var(--blk) + 25%), var(--bg)); }
.blk.ctx { cursor: pointer; opacity: .82; }
.blk.ctx:hover { opacity: 1; }
.blk.focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.meta { display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: center; font-size: 11.5px; color: color-mix(in srgb, var(--ink) 72%, transparent); margin-bottom: 3px; }
.who { font-weight: 600; font-size: 13px; color: var(--ink); cursor: pointer; }
.who:hover, .tag.chan:hover { text-decoration: underline; }
.tag { padding: 0 5px; border-radius: 2px; background: color-mix(in srgb, var(--bg) 55%, transparent); font-size: 11px; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 17px; }
.tag.tool { font-family: var(--mono); font-size: 10.5px; }
.tag.chan { border: 0; cursor: pointer; color: inherit; font: inherit; font-size: 11px; }
.tag.chan:hover { background: var(--bg); }
.meta .sp { margin-left: auto; }
.tools { display: inline-flex; gap: 1px; align-items: center; }
.tools button { border: 1px solid transparent; background: none; cursor: pointer; padding: 0 5px; border-radius: 2px; font-size: 11.5px; color: var(--ink); line-height: 17px; }
.tools button:hover { border-color: color-mix(in srgb, var(--ink) 35%, transparent); }
.tools .pr.on { background: var(--ink); color: var(--bg); font-weight: 600; }
.tools .pin, .tools .cm, .tools .tg { padding: 1px 3px; color: color-mix(in srgb, var(--ink) 45%, transparent); }
.tools .pin:hover, .tools .cm:hover, .tools .pin.on, .tools .cm.on, .tools .tg:hover, .tools .tg.on { color: var(--ink); }
.tools .tg .ic { transform: scaleX(-1); fill-rule: evenodd; }  /* points up and right, like the pin; the hole stays open when filled */
.tools .tg.on > .ic { fill: var(--tc); }  /* filled with the tag's color */
/* Flat line icons (16px grid) in the text color; filled when on: a pinned event, an event with a comment. */
.ic { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.on > .ic { fill: currentColor; }
.ic.inl { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; }
.comment { margin: 2px 0 6px; padding: 4px 8px; border-radius: 3px; background: var(--note); border: 1px solid var(--note-line); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; cursor: text; }
.comment textarea { width: 100%; min-height: 60px; border: 0; outline: 0; background: transparent; resize: vertical; color: var(--ink); }
.text { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5; }
.text code, .cot code { font-family: var(--mono); background: color-mix(in srgb, var(--bg) 60%, transparent); padding: 0 3px; border-radius: 2px; font-size: 12px; }
.text pre { font-family: var(--mono); font-size: 12px; background: color-mix(in srgb, var(--bg) 60%, transparent); padding: 5px 8px; border-radius: 3px; overflow-x: auto; white-space: pre; margin: 4px 0; }
.blk.ctx .text { max-height: 4.5em; overflow: hidden; }
.blk.ctx .cot .body { max-height: 2.9em; overflow: hidden; }
details.cot { margin: 0 0 5px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 40%, transparent); border-left: 2px solid color-mix(in srgb, var(--c) 70%, var(--ink)); padding: 3px 9px 5px; }
details.cot summary { cursor: pointer; font-size: 11.5px; font-weight: 600; color: var(--muted); }
details.cot .body { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; font-style: italic; color: color-mix(in srgb, var(--ink) 85%, transparent); margin-top: 3px; }
/* Long blocks scroll inside themselves, so the events before and after stay on screen. */
.blk.focus .cot .body { max-height: 20vh; overflow: auto; }
.blk.focus .text { max-height: 26vh; overflow: auto; }

.hit { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 3px 7px; border-radius: 3px; cursor: pointer; border: 1px solid var(--line); border-left: 3px solid var(--c); background: var(--bg); font-size: 12px; }
.hit:hover { border-color: var(--muted); border-left-color: var(--c); }
.hit.cur { outline: 2px solid var(--mark-current); }
mark { background: var(--mark); color: #1d2127; padding: 0 1px; border-radius: 2px; }
.hidden { display: none !important; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--field); }
/* ---------- story: the incident's own write-up (HTML), on the left; its event links open events on the right ---------- */
body.has-story { grid-template-columns: var(--story-w, 440px) minmax(0, 1fr); }
body.has-story > :not(#story, header) { grid-column: 2; }
body.has-story > header { grid-column: 1 / -1; }
#story { grid-column: 1; grid-row: 2 / -1; position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
#storyBar { display: flex; gap: 6px; align-items: center; padding: 4px 8px 4px 10px; background: var(--chrome); border-bottom: 1px solid var(--line); }
#storyBar b { font-size: 11.5px; font-weight: 600; }
#storyBar .sp { margin-left: auto; }
#storyBody { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px 30vh; }
#evTip { position: fixed; z-index: 25; pointer-events: none; width: max-content; max-width: 360px; padding: 6px 9px 7px; border-radius: 4px; border: 1px solid var(--line2);
  background: var(--panel); color: var(--ink); font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
#evTip .h { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; } #evTip .h b { font-weight: 600; font-size: 12.5px; }
#evTip .c { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
#evTip .s { color: var(--muted); font-size: 11px; margin: 1px 0 4px; }
#evTip .tg { padding: 0 5px; border-radius: 2px; background: var(--tc); color: #fff; font-weight: 600; }
#evTip .m { white-space: pre-wrap; overflow-wrap: anywhere; }
#storyGrip { position: absolute; right: -4px; top: 0; bottom: 0; width: 7px; z-index: 4; cursor: col-resize; touch-action: none; }
#storyGrip:hover, #storyGrip.drag { background: linear-gradient(90deg, transparent 2px, var(--focus) 2px, var(--focus) 5px, transparent 5px); }
@media (max-width: 860px) { body.has-story { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) minmax(0, 45vh); }
  body.has-story > :not(#story, header) { grid-column: 1; }
  body.has-story > #story { grid-column: 1; grid-row: 5; border-right: 0; border-top: 1px solid var(--line); } #storyGrip { display: none; } }
/* read-only: nothing to edit, load or save */
.readonly #tagAdd, .readonly .trow .x, .readonly #storyAdd, .readonly #saveStatus, .readonly #exportBtn,
.readonly #dsSel, .readonly label.btn:has(#file), .readonly #tagPanel kbd { display: none !important; }
.readonly .comment { cursor: auto; }
.readonly .blk .tools { pointer-events: none; }  /* an event's priority, pin and tag stay in view, as they are, but can't be changed */
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border: 2px solid transparent; background-clip: padding-box; border-radius: 6px; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <div class="ctl">
    <select id="dsSel" title="Dataset"></select>
    <select id="incSel" title="Incident"></select>
    <label class="btn" title="Load a dataset (JSON with an &quot;events&quot; list, or JSONL of event blocks) or an incident file">Load files…<input id="file" type="file" accept=".json,.jsonl,application/json" multiple hidden></label>
  </div>
  <div class="ctl">
    <input id="search" type="search" placeholder="Search events">
    <span id="hitNav" class="hidden"><button class="btn" id="prev" title="Previous match (k)">↑</button><button class="btn" id="next" title="Next match (j)">↓</button></span>
    <label title="Search only the part of the timeline that is on screen"><input type="checkbox" id="inView"> in view only</label>
    <span class="count" id="searchCount"></span>
  </div>
  <div class="ctl" style="margin-left:auto">
    <span class="small" id="saveStatus"></span>
    <button class="btn hidden" id="exportBtn" title="Download this incident and its data as a zip to share (at most 60 MB: a bigger dataset is cut to the incident's agents, channels and time range)">Export</button>
    <button class="btn hidden" id="storyBtn" title="Show or hide the incident's story">Story</button>
    <button class="btn" id="theme" title="Toggle light/dark">◐</button>
  </div>
</header>

<section id="tl">
  <div id="tlbar">
    <div class="ctl">
      <select id="scopeSel" title="What the timeline shows"></select>
      <span class="seg" id="laneSeg" title="Lanes: a line per agent, or a line per channel">
        <button class="btn on" id="laneAgent">by agent</button><button class="btn" id="laneChannel">by channel</button>
      </span>
      <label id="othersLbl"><input type="checkbox" id="showOthers" checked> <span id="othersTxt">other events</span></label>
      <span class="seg"><button class="btn" id="zOut" title="Zoom out">−</button><button class="btn" id="zIn" title="Zoom in">+</button><button class="btn" id="zFit" title="Fit the whole scope">Fit</button></span>
    </div>
    <span class="small" id="tlInfo"></span>
  </div>
  <div id="tlRow">
    <div id="tlWrap"><canvas id="tlCanvas" height="40"></canvas></div>
    <div id="tagPanel" class="hidden"></div><div id="tagGrip" title="Drag to resize the tags panel; double-click to reset"></div>
  </div>
  <div id="laneAdd" class="hidden"><input type="search" placeholder="Filter…"><div class="list"></div></div>
</section>
<div id="split" title="Drag to resize the timeline; double-click to reset"></div>

<main>
  <aside id="side"><div class="small">Loading…</div></aside>
  <section id="detail">
    <div id="dbar" class="hidden">
      <div id="tabs"></div>
      <div id="sp" class="hidden">
        <button class="sph" id="spHead" title="Show or hide the search parameters"><b id="spArrow">▾ Search</b><span class="small" id="spSum"></span></button>
        <div id="spBody">
          <label for="spQ">Text</label><input id="spQ" type="search" placeholder="Words in the text, reasoning or tool (empty: any)" autocomplete="off">
          <label>Channels</label><div class="cin" data-kind="chans"><span class="chips"></span><input placeholder="Any channel (type to add)" autocomplete="off"><div class="sug hidden"></div></div>
          <label>Agents</label><div class="cin" data-kind="agents"><span class="chips"></span><input placeholder="Any agent (type to add)" autocomplete="off"><div class="sug hidden"></div></div>
          <span></span><div><button class="lnk" id="spMore" title="Open this search in the custom view builder: add pinned events, tags, sources, or match any instead of all">More options: pins, tags, sources, match any…</button></div>
        </div>
      </div>
      <div id="vbBack" class="modalBack hidden"><div id="vb" class="modal" role="dialog" aria-modal="true" aria-labelledby="vbTitle">
        <div class="vbhead"><b id="vbTitle">Custom view</b><button class="vbx" id="vbClose" title="Close (Esc)">×</button></div>
        <div class="vbbody">
        <div class="vbtop"><input id="vbName" type="text" placeholder="View name (optional)" autocomplete="off">
          <span class="seg" title="All: an event must match every part you picked. Any: matching one part is enough."><button class="btn" data-m="all">match all</button><button class="btn" data-m="any">match any</button></span></div>
        <div class="vbsec" id="vbInc"></div>
        <div class="vbsec"><div class="vbh"><b>Agents</b><input id="vbAgQ" type="search" placeholder="Filter" autocomplete="off"><button class="lnk" data-sel="agents" title="Select every agent listed">select all</button><button class="lnk" data-unsel="agents">deselect all</button></div><div class="vbl" id="vbAgents"></div></div>
        <div class="vbsec"><div class="vbh"><b>Channels</b><input id="vbChQ" type="search" placeholder="Filter" autocomplete="off"><button class="lnk" data-sel="channels" title="Select every channel listed">select all</button><button class="lnk" data-unsel="channels">deselect all</button></div><div class="vbl" id="vbChannels"></div></div>
        <div class="vbsec"><div class="vbh"><b>Sources</b><input id="vbSrcQ" type="search" placeholder="Filter" autocomplete="off"><button class="lnk" data-sel="sources" title="Select every source listed">select all</button><button class="lnk" data-unsel="sources">deselect all</button></div><div class="vbl" id="vbSources"></div></div>
        <div class="vbsec"><div class="vbh"><b>Text</b></div><input id="vbText" type="search" placeholder="Words in the event's text, reasoning or tool" autocomplete="off"></div>
        </div>
        <div class="vbfoot"><span class="count" id="vbCount"></span><button class="btn" id="vbCancel">Cancel</button><button class="btn on" id="vbOpen">Open view</button></div>
      </div></div>
      <div id="cxBack" class="modalBack hidden"><div class="modal cxm" role="dialog" aria-modal="true" aria-labelledby="cxTitle">
        <div class="vbhead"><b id="cxTitle">Add context</b><button class="vbx" id="cxClose" title="Close (Esc)">×</button></div>
        <div class="vbbody">
          <div class="vbh"><label>Events before <input id="cxBefore" type="number" min="0" max="500" step="1"></label><label>after <input id="cxAfter" type="number" min="0" max="500" step="1"></label></div>
          <div class="vbsec"><div class="vbh"><b>From</b><span class="seg"><button class="btn" data-from="channel" title="Neighbours in the same channel as each event">same channel</button><button class="btn" data-from="agent" title="The same agent's events just before and after">same agent</button><button class="btn" data-from="any" title="Whatever happened just before and after, anywhere">anywhere</button></span></div></div>
        </div>
        <div class="vbfoot"><span class="count" id="cxCount"></span><button class="btn" id="cxRemove">Remove context</button><button class="btn" id="cxCancel">Cancel</button><button class="btn on" id="cxApply">Apply</button></div>
      </div></div>
      <div class="ctl">
        <span class="seg"><button class="btn" id="evPrev" title="Previous event (←)">◀</button><button class="btn" id="evNext" title="Next event (→)">▶</button></span>
        <span class="small" id="pos"></span>
      </div>
      <div class="ctl"><label title="Open the reasoning on every event (click a reasoning header to open or close just that one)"><input type="checkbox" id="showCot"> reasoning open</label></div>
      <div class="ctl" id="ctxCtl"><button class="btn" id="ctxBtn" title="Add the events just before and after each event in this tab (shown faded)">Context +</button><button class="btn hidden" id="ctxClear" title="Remove the context">×</button></div>
    </div>
    <div id="blocks"><div class="empty drop" id="drop"><p><b>Loading dataset…</b></p></div></div>
  </section>
</main>
<section id="story" class="hidden">
  <div id="storyGrip" title="Drag to resize the story; double-click to reset"></div>
  <div id="storyBar"><b>Story</b><span class="small" id="storyInfo"></span><span class="sp"></span>
    <button class="btn" id="storyFold" title="Collapse or expand every cell">Collapse all</button>
    <button class="btn" id="storyAdd" title="Add a cell at the end (markdown, written by you)">+ Cell</button></div>
  <div id="storyBody"></div>
</section>
<div id="tip" class="hidden"></div>

<script>
const $ = id => document.getElementById(id);
const MAX_HITS_SHOWN = 200;

// ---------- state ----------
let datasets = [], DS = null, E = [];           // E = event blocks of the current dataset, sorted by time
let agents = [], byId = new Map();              // agents: [{key, name, type, n, idxs, hue, bg}]
let incList = [], INC = null, incId = null, actById = new Map();
let focus = -1, ctxBy = 'all';                    // ctxBy: what the event list (its open tab) follows: 'all', 'agent' or 'channel'
let channels = [], chanByKey = new Map(), chFilter = '';  // channels: [{key, n, idxs, agents}]
let scope = 'all', xmode = 'time', view = { a: 0, b: 1 }, lanes = [], laneOf = new Map();
let hidden = new Set(), hits = [], hitCur = -1, showOthers = true;
const writable = location.protocol.startsWith('http');
// Read-only (a public demo): <html data-readonly>, or ?readonly. Nothing can be edited or saved.
const READONLY = document.documentElement.hasAttribute('data-readonly') || new URLSearchParams(location.search).has('readonly');
if (READONLY) document.documentElement.classList.add('readonly');
const EMBEDDED = window.parent !== window;  // inside a page (the website): tell it which event is open, take "go to" requests

// ---------- helpers ----------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function md(s) {  // tiny, safe markdown: code blocks, inline code, bold, italics
  const parts = esc(s).split(/```/);
  return parts.map((p, i) => i % 2 ? `<pre>${p.replace(/^[a-z]*\n/, '')}</pre>` :
    p.replace(/`([^`\n]+)`/g, '<code>$1</code>')
     .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
     .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>')).join('');
}
const pad = n => String(n).padStart(2, '0');
function fmtT(ms, secs = true) {  // UTC
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}${secs ? ':' + pad(d.getUTCSeconds()) : ''}`;
}
function parseT(s) {
  if (s == null || s === '') return NaN;
  if (typeof s === 'number') return s < 1e11 ? s * 1000 : s;
  s = String(s).trim().replace(' ', 'T');
  return Date.parse(/([zZ]|[+-]\d\d:?\d\d)$/.test(s) ? s : s + 'Z');  // no zone given: read as UTC
}
function span(ms) {
  const s = Math.abs(ms) / 1000;
  if (s < 90) return `${Math.round(s)} s`; if (s < 5400) return `${Math.round(s / 60)} min`;
  if (s < 129600) return `${(s / 3600).toFixed(1)} h`; return `${Math.round(s / 86400)} days`;
}
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'incident';
const snip = (s, n = 90) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const X = i => xmode === 'time' ? E[i]._t : i;
// first position in a sorted index list whose X value is >= x
function lower(idxs, x) { let lo = 0, hi = idxs.length; while (lo < hi) { const m = (lo + hi) >> 1; X(idxs[m]) < x ? lo = m + 1 : hi = m; } return lo; }
function firstAtOrAfter(t) { let lo = 0, hi = E.length; while (lo < hi) { const m = (lo + hi) >> 1; E[m]._t < t ? lo = m + 1 : hi = m; } return lo; }

// ---------- datasets ----------
function parseEvents(text, fileName) {  // {events:[...]}, a bare array, or JSONL
  let raw;
  try { raw = JSON.parse(text); }
  catch { raw = text.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)); }
  if (raw && !Array.isArray(raw) && Array.isArray(raw.actions)) return { incident: raw };
  const events = Array.isArray(raw) ? raw : raw.events;
  if (!Array.isArray(events)) throw new Error('expected an "events" list of event blocks, or an incident with "actions"');
  const id = raw.dataset || slug((fileName || 'dataset').replace(/\.[a-z]+$/i, ''));
  return { id, title: raw.title || id, events };
}
function setDataset(id, title, events) {
  DS = { id, title };
  let last = 0;
  events.forEach((e, i) => { let t = parseT(e.time_stamp); if (isNaN(t)) t = last; last = t; e._t = t; e._o = i; });
  events.sort((a, b) => a._t - b._t || a._o - b._o);
  E = events; byId = new Map(); chanByKey = new Map(); chFilter = ''; const am = new Map();
  E.forEach((e, i) => {
    e._i = i; e.event_id = String(e.event_id ?? e._o); byId.set(e.event_id, i);
    const key = String(e.agent_ID ?? e.agent_name ?? '(unknown)');
    let a = am.get(key);
    if (!a) am.set(key, a = { key, name: String(e.agent_name ?? e.agent_ID ?? '(unknown)'), type: e.agent_type || '', n: 0, cot: 0, idxs: [] });
    a.n++; if (e.reasoning) a.cot++; a.idxs.push(i); e._a = a;
    e._c = null;
    if (e.channel != null && e.channel !== '') {
      const ck = String(e.channel); let c = chanByKey.get(ck);
      if (!c) chanByKey.set(ck, c = { key: ck, n: 0, idxs: [], agents: new Set() });
      c.n++; c.idxs.push(i); c.agents.add(a); e._c = c;
    }
  });
  channels = [...chanByKey.values()].sort((a, b) => b.n - a.n || a.key.localeCompare(b.key));
  // Colors follow the agent, not its position on screen: fixed per dataset by overall rank, golden-angle hues.
  agents = [...am.values()].sort((a, b) => b.n - a.n);
  agents.forEach((a, i) => { a.hue = Math.round((i * 137.508 + 20) % 360); a.alt = i % 2; a.bg = `hsl(${a.hue} 62% ${a.alt ? 76 : 83}%)`; });
  // Mostly-empty time ranges (bursts of activity months apart) read better with one step per event.
  const bins = new Set(), t0 = E[0]?._t ?? 0, w = ((E[E.length - 1]?._t ?? 0) - t0) / 200 || 1;
  for (const e of E) bins.add(Math.min(199, Math.floor((e._t - t0) / w)));
  DS.gappy = bins.size < 100;
  hidden = new Set(); hits = []; hitCur = -1; $('search').value = ''; $('searchCount').textContent = ''; $('hitNav').classList.add('hidden');
  INC = null; incId = null; actById = new Map(); focus = -1; scope = 'all';
  storyEditing = null; renderStory();
  $('dbar').classList.remove('hidden');
}

async function loadDataset(id) {
  const d = datasets.find(x => x.id === id); if (!d) return;
  $('blocks').innerHTML = `<div class="empty"><b>Loading ${esc(d.title || d.id)}…</b><br><span class="small">${(d.events || 0).toLocaleString()} events</span></div>`;
  const r = await fetch('data/' + d.file); if (!r.ok) throw new Error(`${d.file}: HTTP ${r.status}`);
  const p = parseEvents(await r.text(), d.file);
  setDataset(d.id, d.title || p.title, p.events);
  await loadIncidentList();
}
async function loadIncidentList() {
  incList = incList.filter(x => x.local);
  try { const r = await fetch('incidents/index.json', { cache: 'no-store' }); if (r.ok) incList = incList.concat(await r.json()); } catch {}
  fillSelectors();
}
function fillSelectors() {
  $('dsSel').innerHTML = datasets.map(d => `<option value="${esc(d.id)}">${esc(d.title || d.id)}</option>`).join('');
  if (DS) $('dsSel').value = DS.id;
  const mine = incList.filter(x => !x.dataset || x.dataset === DS?.id);
  $('incSel').innerHTML = `<option value="">No incident (whole dataset)</option>` + mine.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
  $('incSel').value = incId || '';
  fillScope();
}
function fillScope() {
  $('scopeSel').innerHTML = `<option value="all">Timeline: all incidents</option>` +
    (INC ? `<option value="incident">Timeline: this incident</option>` : '');
  $('scopeSel').value = scope;
  $('laneSeg').classList.toggle('hidden', scope !== 'incident');
  $('othersLbl').classList.toggle('hidden', scope !== 'incident');
  laneButtons();
}

// ---------- incidents ----------
function indexActions() { actById = new Map((INC?.actions || []).map(a => [String(a.event_id), a])); }
const actionAt = i => i >= 0 ? actById.get(E[i].event_id) : undefined;
async function selectIncident(id, focusId) {
  if (storyEditing) finishEdit(true);  // save an open cell edit into the incident it belongs to
  if (layoutTimer) flushLayout(); layoutSaved = null;  // the layout of the incident being left
  if (!id) { INC = null; incId = null; incVer = incBase = null; indexActions(); setScope('all'); fillSelectors(); renderSide(); renderStory(); setFocus(focus >= 0 ? focus : 0); return; }
  const meta = incList.find(x => x.id === id);
  let inc = meta?.local, ver = null;
  if (!inc) { const r = await fetch(`incidents/${encodeURIComponent(id)}.json`, { cache: 'no-store' }); if (!r.ok) return alert(`Could not load incident ${id}`); inc = await r.json(); ver = r.headers.get('X-Forel-Version'); }
  normIncident(inc);
  INC = inc; incId = id; incVer = ver; incBase = structuredClone(inc); indexActions(); fillSelectors(); setScope('incident'); renderSide(); renderStory();
  armLayout();
  if (restoreLayout(inc.view)) { const f = byId.get(String(focusId)); if (f != null && f !== focus) setFocus(f); return; }  // the tabs and timeline as they were left; a linked event is then opened
  let f = byId.get(String(focusId));  // a linked event, else the most important pinned one, else the start of the range
  if (f == null) { const a = sortedActions('priority').find(a => a.pinned); f = a ? byId.get(a.event_id) : Math.min(firstAtOrAfter(scopeRange()[0]), E.length - 1); }
  setFocus(f);
}
function sortedActions(how = 'time') {

const MAX_CHANNELS_SHOWN = 150;

// ---------- search ----------
const rxOf = q => new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
function runSearch() {
  const q = $('search').value.trim(); hits = []; hitCur = -1;
  if (q && E.length) {
    const rx = rxOf(q); let lo = 0, hi = E.length;
    if ($('inView').checked) { const [t0, t1] = viewTimeRange(); lo = firstAtOrAfter(t0); hi = firstAtOrAfter(t1 + 1); }
    for (let i = lo; i < hi; i++) { const e = E[i]; if (hidden.has(e._a.key)) continue;
      if ((e.text && rx.test(e.text)) || (e.reasoning && rx.test(e.reasoning)) || (e.tool && rx.test(e.tool)) || rx.test(e._a.name) || (e.source && rx.test(e.source)) || (e._c && rx.test(e._c.key))) hits.push(i); }
  }
  $('searchCount').textContent = q ? `${hits.length.toLocaleString()} match${hits.length === 1 ? '' : 'es'}` : '';
  $('hitNav').classList.toggle('hidden', !q);   // the ↑ ↓ match buttons only appear once something is searched
  renderHits(); draw();
}
function renderHits() {

  $('hitCount').textContent = q ? `(${hits.length.toLocaleString()}${hits.length > MAX_HITS_SHOWN ? `, first ${MAX_HITS_SHOWN} listed` : ''})` : '';

    const e = E[i], src = [e.text, e.reasoning, e.tool].find(s => s && rx.test(s)) || e.text || '', at = Math.max(0, src.search(rx) - 30);
    return `<button class="hit" data-i="${i}" style="--c:${e._a.bg}"><span class="small">${fmtT(e._t).slice(5)} · ${esc(e._a.name)}</span><br>${at ? '…' : ''}${esc(snip(src.slice(at), 110))}</button>`;
  }).join('') || '<div class="small">No matches.</div>';
  $('hitBox').querySelectorAll('.hit').forEach(b => b.onclick = () => { hitCur = hits.indexOf(+b.dataset.i); setFocus(+b.dataset.i); showHit(); });

}
function showHit() {
  $('searchCount').textContent = `${hitCur + 1} / ${hits.length.toLocaleString()}`;
  $('hitBox').querySelectorAll('.hit').forEach(b => b.classList.toggle('cur', +b.dataset.i === hits[hitCur]));
  $('blocks').querySelector('.blk.focus mark')?.scrollIntoView({ block: 'center' });
}
function stepHit(d) {

  if (hitCur < 0) { let lo = 0, hi = hits.length; while (lo < hi) { const m = (lo + hi) >> 1; hits[m] < focus ? lo = m + 1 : hi = m; } hitCur = d > 0 ? (hits[lo] === focus ? lo : lo - 1) : lo; }

function markText(root, q) {
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('mark, summary, .tools, .comment, .pb') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);

    const s = n.nodeValue; rx.lastIndex = 0; if (!rx.test(s)) continue;
    const frag = document.createDocumentFragment(); let last = 0; rx.lastIndex = 0; let m;

      last = m.index + m[0].length; if (!m[0].length) rx.lastIndex++;

  const k = e.key;
  if (k === '/') { e.preventDefault(); $('search').focus(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); setFocus(stepFrom(focus, -1)); }
  else if (k === 'ArrowRight') { e.preventDefault(); setFocus(stepFrom(focus, 1)); }
  else if (k === 'j') stepHit(1); else if (k === 'k') stepHit(-1);
  else if (k === 'p') togglePin(focus);
  else if (k === 'c') { e.preventDefault(); editComment(focus); }
  else if (e.shiftKey && /^Digit[1-9]$/.test(e.code)) { const t = INC?.tags[+e.code.slice(5) - 1]; if (t) setTag(focus, t.id); }
  else if (/^[1-9]$/.test(k)) setPriority(focus, +k);

async function readFiles(files) {

      if (p.incident) {  // an incident file: open it against the current dataset
        const id = slug(f.name.replace(/\.[a-z]+$/i, '')); incList = incList.filter(x => x.id !== id);
        incList.push({ id, name: p.incident.name || id, dataset: p.incident.dataset, from_to: p.incident.from_to, actions: p.incident.actions, local: p.incident });
        if (DS) { fillSelectors(); await selectIncident(id); }
      } else {
        datasets = datasets.filter(d => d.id !== p.id).concat({ id: p.id, title: p.title, events: p.events.length, local: true });
        setDataset(p.id, p.title, p.events); await loadIncidentList(); start();
      }
    } catch (e) { alert(`${f.name}: ${e.message}`); }

}
